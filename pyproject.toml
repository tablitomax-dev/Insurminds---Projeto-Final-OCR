[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurminds-platform"
version = "1.0.0"
description = "Plataforma de análise e comparação de apólices D&O (monólito modular em Python)"
requires-python = ">=3.11"
# Stack completo do projeto — instalável de ponta a ponta com
# `pip install -e ".[dev]"` (reprodução/simulação em ambiente novo).
dependencies = [
    # Núcleo e contrato versionado (shared_kernel).
    "pydantic>=2,<3",
    # LLM via Pydantic AI: Gemini (GoogleModel) e OpenRouter (OpenAIModel).
    # Os extras trazem google-genai e openai; google-genai também é usado
    # direto pelo pipeline (embeddings do document_processing).
    "pydantic-ai-slim[openai,google]>=1.107,<2",
    "google-genai>=1.75",
    # Persistência analítica e vetores (DuckDB + Qdrant).
    "duckdb>=1.5",
    "qdrant-client>=1.18",
    # document_processing: PDF (PyMuPDF/fitz), OCR e layout (PaddleOCR + PaddlePaddle).
    "PyMuPDF>=1.28",
    "paddleocr>=3.7",
    "paddlepaddle>=3.3",
    # UI do analista (Streamlit); pyarrow é exigido por st.dataframe.
    "streamlit>=1.65",
    "pyarrow>=25,<26,!=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.16",
    "mypy>=2.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: testes que exigem dependências externas (pulados quando ausentes)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
cache-dir = ".tmp/ruff_cache"
# Fora do escopo do gate: ferramentas do Reversa, instalados locais e artefatos.
extend-exclude = [".tools", ".tmp", "exports", ".claude", ".agents", ".reversa"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
# Convenção do repositório: pacotes do projeto (src/ e tests/fakes) no mesmo bloco.
known-first-party = ["fakes", "modules", "shared_kernel"]

[tool.ruff.lint.per-file-ignores]
# Contrato versionado: mudanças em src/shared_kernel só via caixa postal + bump
# de CONTRACTS_VERSION (aprendizados §5.2). Ordem de imports preservada.
"src/shared_kernel/**" = ["I001"]
# Terreno do Dev 1: ordem de imports fica para a manutenção dele (caixa postal).
"src/modules/document_processing/**" = ["I001"]

[tool.mypy]
# Runtime real do projeto é Python 3.12 (venv) — os stubs de dependências do
# streamlit (numpy) usam sintaxe 3.12 (`type` statements) e exigem a versão.
python_version = "3.12"
ignore_missing_imports = true
cache_dir = ".tmp/mypy_cache"

[[tool.mypy.overrides]]
# Terreno do Dev 1: pendências de tipagem (service/indexing) registradas para a
# manutenção dele — o gate não refatora código alheio (remover quando ele corrigir).
module = [
    "document_processing",
    "document_processing.*",
    "modules.document_processing",
    "modules.document_processing.*",
]
ignore_errors = true
